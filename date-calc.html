<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>만 나이 계산기</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="만 나이, 세는 나이, 연 나이를 생년월일로 한 번에 계산합니다. 날짜 차이, 디데이, 날짜 더하기까지 브라우저에서 바로 처리합니다." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="layout layout--dev" data-tool="date-calc">
  <div class="page page--dev">
    <div class="page-controls">
      <label class="sr-only" for="localeSelect" data-i18n="common.languageLabel">언어</label>
      <div class="locale-switcher">
        <select id="localeSelect" aria-label="Language">
          <option value="ko" data-i18n="common.languageKorean">한국어</option>
          <option value="en" data-i18n="common.languageEnglish">English</option>
        </select>
      </div>
    </div>

    <header class="page-header">
      <a class="back-link" href="/" data-i18n="common.back">← 도구 목록으로</a>
      <h1 data-i18n="dateCalc.title">만 나이 계산기</h1>
      <p data-i18n="dateCalc.description">생년월일을 넣으면 만 나이·세는 나이·연 나이를 함께 계산합니다. 날짜 차이, 디데이, 날짜 더하기도 같은 화면에서 처리합니다.</p>
    </header>

    <main class="tool">
      <div class="tool-tabs" role="tablist" data-tool-tabs>
        <button type="button" class="tool-tab is-active" id="tabbtn-age" role="tab"
                aria-selected="true" data-tab-target="tab-age" data-i18n="dateCalc.tab.age">만 나이</button>
        <button type="button" class="tool-tab" id="tabbtn-diff" role="tab"
                aria-selected="false" data-tab-target="tab-diff" data-i18n="dateCalc.tab.diff">날짜 차이</button>
        <button type="button" class="tool-tab" id="tabbtn-dday" role="tab"
                aria-selected="false" data-tab-target="tab-dday" data-i18n="dateCalc.tab.dday">디데이</button>
        <button type="button" class="tool-tab" id="tabbtn-add" role="tab"
                aria-selected="false" data-tab-target="tab-add" data-i18n="dateCalc.tab.add">더하기</button>
      </div>

      <div class="tool__stack" id="tab-age" role="tabpanel" aria-labelledby="tabbtn-age">
        <section class="tool__panel tool__panel--stack">
          <label for="dcBirth" data-i18n="dateCalc.age.birth">생년월일</label>
          <input id="dcBirth" type="date" data-persist="birth" />
          <label for="dcAgeBase" data-i18n="dateCalc.age.base">기준일 (기본: 오늘)</label>
          <input id="dcAgeBase" type="date" data-persist="ageBase" />
        </section>
        <section class="tool__panel tool__panel--stack tool__panel--summary">
          <label data-i18n="dateCalc.age.resultTitle">나이 결과</label>
          <div class="tool-grid-3">
            <div><label for="dcMan" data-i18n="dateCalc.age.man">만 나이</label><input id="dcMan" type="text" readonly /></div>
            <div><label for="dcSe" data-i18n="dateCalc.age.se">세는 나이</label><input id="dcSe" type="text" readonly /></div>
            <div><label for="dcYeon" data-i18n="dateCalc.age.yeon">연 나이</label><input id="dcYeon" type="text" readonly /></div>
            <div><label for="dcLived" data-i18n="dateCalc.age.lived">살아온 기간</label><input id="dcLived" type="text" readonly /></div>
            <div><label for="dcLivedDays" data-i18n="dateCalc.age.livedDays">살아온 일수</label><input id="dcLivedDays" type="text" readonly /></div>
            <div><label for="dcNextBirthday" data-i18n="dateCalc.age.nextBirthday">다음 생일까지</label><input id="dcNextBirthday" type="text" readonly /></div>
          </div>
        </section>
      </div>

      <div class="tool__stack" id="tab-diff" role="tabpanel" aria-labelledby="tabbtn-diff" hidden>
        <section class="tool__panel tool__panel--stack">
          <label for="dcFrom" data-i18n="dateCalc.diff.from">시작일</label>
          <input id="dcFrom" type="date" data-persist="from" />
          <label for="dcTo" data-i18n="dateCalc.diff.to">종료일</label>
          <input id="dcTo" type="date" data-persist="to" />
        </section>
        <section class="tool__panel tool__panel--stack tool__panel--summary">
          <label data-i18n="dateCalc.diff.resultTitle">차이 결과</label>
          <div class="tool-grid-3">
            <div><label for="dcDiffDays" data-i18n="dateCalc.diff.days">차이 일수</label><input id="dcDiffDays" type="text" readonly /></div>
            <div><label for="dcDiffInclusive" data-i18n="dateCalc.diff.inclusive">당일 포함</label><input id="dcDiffInclusive" type="text" readonly /></div>
            <div><label for="dcDiffWeeks" data-i18n="dateCalc.diff.weeks">주 단위</label><input id="dcDiffWeeks" type="text" readonly /></div>
            <div><label for="dcDiffYmd" data-i18n="dateCalc.diff.ymd">년·개월·일</label><input id="dcDiffYmd" type="text" readonly /></div>
            <div><label for="dcDiffWeekdays" data-i18n="dateCalc.diff.weekdays">평일 수 (주말 제외)</label><input id="dcDiffWeekdays" type="text" readonly /></div>
            <div><label for="dcDiffMonths" data-i18n="dateCalc.diff.months">개월 합계</label><input id="dcDiffMonths" type="text" readonly /></div>
          </div>
        </section>
      </div>

      <div class="tool__stack" id="tab-dday" role="tabpanel" aria-labelledby="tabbtn-dday" hidden>
        <section class="tool__panel tool__panel--stack">
          <label for="dcTarget" data-i18n="dateCalc.dday.target">목표일</label>
          <input id="dcTarget" type="date" data-persist="target" />
          <label for="dcDdayBase" data-i18n="dateCalc.dday.base">기준일 (기본: 오늘)</label>
          <input id="dcDdayBase" type="date" data-persist="ddayBase" />
        </section>
        <section class="tool__panel tool__panel--stack tool__panel--summary">
          <label data-i18n="dateCalc.dday.resultTitle">디데이 결과</label>
          <div class="tool-grid-3">
            <div><label for="dcDdayLabel" data-i18n="dateCalc.dday.label">디데이</label><input id="dcDdayLabel" type="text" readonly /></div>
            <div><label for="dcDdayDays" data-i18n="dateCalc.dday.days">남은/지난 일수</label><input id="dcDdayDays" type="text" readonly /></div>
            <div><label for="dcDdayCountUp" data-i18n="dateCalc.dday.countUp">첫날부터 몇 일째</label><input id="dcDdayCountUp" type="text" readonly /></div>
            <div><label for="dcDdayWeekday" data-i18n="dateCalc.dday.weekday">목표일 요일</label><input id="dcDdayWeekday" type="text" readonly /></div>
          </div>
        </section>
      </div>

      <div class="tool__stack" id="tab-add" role="tabpanel" aria-labelledby="tabbtn-add" hidden>
        <section class="tool__panel tool__panel--stack">
          <label for="dcAddBase" data-i18n="dateCalc.add.base">기준일</label>
          <input id="dcAddBase" type="date" data-persist="addBase" />
          <div class="tool-grid-3">
            <div><label for="dcAddYears" data-i18n="dateCalc.add.years">년</label><input id="dcAddYears" type="number" value="0" step="1" data-persist="addYears" /></div>
            <div><label for="dcAddMonths" data-i18n="dateCalc.add.months">개월</label><input id="dcAddMonths" type="number" value="0" step="1" data-persist="addMonths" /></div>
            <div><label for="dcAddWeeks" data-i18n="dateCalc.add.weeks">주</label><input id="dcAddWeeks" type="number" value="0" step="1" data-persist="addWeeks" /></div>
            <div><label for="dcAddDays" data-i18n="dateCalc.add.days">일</label><input id="dcAddDays" type="number" value="100" step="1" data-persist="addDays" /></div>
            <div><label for="dcAddBusiness" data-i18n="dateCalc.add.business">영업일</label><input id="dcAddBusiness" type="number" value="0" step="1" data-persist="addBusiness" /></div>
          </div>
          <p class="panel-subtitle" data-i18n="dateCalc.add.hint">음수를 넣으면 과거로 계산합니다. 영업일은 주말만 제외하며 공휴일은 반영하지 않습니다.</p>
        </section>
        <section class="tool__panel tool__panel--stack tool__panel--summary">
          <label data-i18n="dateCalc.add.resultTitle">계산 결과</label>
          <div class="tool-grid-3">
            <div><label for="dcAddResult" data-i18n="dateCalc.add.result">결과 날짜</label><input id="dcAddResult" type="text" readonly /></div>
            <div><label for="dcAddWeekday" data-i18n="dateCalc.add.weekday">요일</label><input id="dcAddWeekday" type="text" readonly /></div>
            <div><label for="dcAddFromToday" data-i18n="dateCalc.add.fromToday">오늘로부터</label><input id="dcAddFromToday" type="text" readonly /></div>
          </div>
        </section>
      </div>
    </main>

    <p id="dcMessage" class="message" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="/src/site.js"></script>
  <script type="module" src="/src/date-calc.js"></script>
</body>
</html>
